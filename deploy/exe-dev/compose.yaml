name: laravel-app-starter-kit

x-app: &app
  image: ${APP_IMAGE:-laravel-app-starter-kit:latest}
  env_file: .env
  environment:
    APP_DEBUG: "false"
    APP_ENV: production
    AUTORUN_ENABLED: "false"
    CACHE_STORE: database
    DB_CONNECTION: pgsql
    DB_DATABASE: ${POSTGRES_DB:-laravel}
    DB_HOST: postgres
    DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/exe-dev/.env}
    DB_PORT: "5432"
    DB_USERNAME: ${POSTGRES_USER:-laravel}
    LOG_CHANNEL: stderr
    QUEUE_CONNECTION: database
    SESSION_DRIVER: database
    SESSION_SECURE_COOKIE: "true"
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  volumes:
    - app_storage:/var/www/html/storage/app

services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8080"

  worker:
    <<: *app
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=90
      - --max-time=3600
    healthcheck:
      test:
        - CMD-SHELL
        - ps -eo args | grep -q '[a]rtisan queue:work'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    <<: *app
    command:
      - php
      - artisan
      - schedule:work
    healthcheck:
      test:
        - CMD-SHELL
        - ps -eo args | grep -q '[a]rtisan schedule:work'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  release:
    <<: *app
    command:
      - php
      - artisan
      - migrate
      - --force
      - --no-interaction
    profiles:
      - release
    healthcheck:
      disable: true
    restart: "no"

  postgres:
    image: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laravel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/exe-dev/.env}
      POSTGRES_USER: ${POSTGRES_USER:-laravel}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  app_storage:
  postgres_data:
