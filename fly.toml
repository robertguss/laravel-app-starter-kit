app = "replace-with-your-fly-app-name"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "php artisan migrate --force --no-interaction"
  strategy = "rolling"

[env]
  APP_DEBUG = "false"
  APP_ENV = "production"
  AUTORUN_ENABLED = "false"
  CACHE_STORE = "database"
  DB_CONNECTION = "pgsql"
  FILESYSTEM_DISK = "local"
  LOG_CHANNEL = "stderr"
  QUEUE_CONNECTION = "database"
  SESSION_DRIVER = "database"
  SESSION_SECURE_COOKIE = "true"

[processes]
  web = "/init"
  worker = "php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600"
  scheduler = "php artisan schedule:work"

[http_service]
  processes = ["web"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/up"
    timeout = "5s"

[[vm]]
  processes = ["web", "worker", "scheduler"]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
