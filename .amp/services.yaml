services:
  postgres:
    command: >-
      sudo -u postgres /usr/lib/postgresql/18/bin/postgres
      -D /var/lib/postgresql/18/main
      -c config_file=/etc/postgresql/18/main/postgresql.conf
      -p "$PORT"
    port: 5432

  web:
    command: >-
      until pg_isready --host=127.0.0.1 --port=5432 --username=laravel; do sleep 1; done;
      php artisan optimize:clear &&
      APP_URL="$PUBLIC_URL" ASSET_URL="$PUBLIC_URL"
      php artisan serve --host=0.0.0.0 --port="$PORT"
    health: /up
    portal:
      title: Laravel Starter
      description: Conventional Laravel application with the generated frontend build.

portals:
  - url: /up
    title: Application health
