name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
        env:
          POSTGRES_DB: laravel_app_starter_kit
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: laravel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laravel -d laravel_app_starter_kit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: laravel

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Composer Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare Application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Install npm Dependencies
        run: npm ci

      - name: Create Test Databases
        run: |
          psql -h 127.0.0.1 -U laravel -d postgres -c 'CREATE DATABASE laravel_app_starter_kit_test'
          psql -h 127.0.0.1 -U laravel -d postgres -c 'CREATE DATABASE laravel_app_starter_kit_browser'

      - name: Migrate Development Database
        run: php artisan migrate --force --no-interaction

      - name: Install Browser
        run: npx playwright install --with-deps chromium

      - name: Run CI Checks
        run: composer ci:check
